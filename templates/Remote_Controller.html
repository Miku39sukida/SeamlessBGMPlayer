<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎮 远程控制器 · 验证</title>
<style>
  :root {
    --bg: #15131c; --panel: #211d2e; --panel2: #2a2540; --primary: #ff7aad;
    --text: #f3eef7; --muted: #a99fb8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    overscroll-behavior: none;
  }
  .card {
    width: 100%; max-width: 340px; margin: 16px; background: var(--panel);
    border-radius: 18px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .pwd-input {
    width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--panel2);
    background: var(--bg); color: var(--text); font-size: 16px; outline: none; box-sizing: border-box;
  }
  .pwd-input:focus { border-color: var(--primary); }
  .pwd-err { color: #ff9b98; font-size: 13px; min-height: 18px; margin-top: 8px; }
  .pwd-btn {
    width: 100%; margin-top: 14px; border: none; border-radius: 12px; padding: 14px 0;
    font-size: 16px; font-weight: 700; color: #fff; background: var(--primary); cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  .pwd-btn:active { transform: scale(.98); }
  .pwd-btn:disabled { opacity: .5; }
</style>
</head>
<body>
  <div class="card">
    <h2>🔒 远程控制器验证</h2>
    <p>请输入播放器的访问密码（保存在 password.txt，与后台管理密码相同）。验证通过后才加载控制界面。</p>
    <input id="pwdInput" class="pwd-input" type="password" placeholder="请输入密码" autocomplete="current-password" autofocus>
    <div id="pwdErr" class="pwd-err"></div>
    <button id="pwdBtn" class="pwd-btn">验证并进入</button>
  </div>
<script>
(function () {
  'use strict';
  var pwdInput = document.getElementById('pwdInput');
  var pwdBtn = document.getElementById('pwdBtn');
  var pwdErr = document.getElementById('pwdErr');

  function submit() {
    var v = (pwdInput.value || '').trim();
    if (!v) { pwdErr.textContent = '请输入密码'; return; }
    pwdBtn.disabled = true; pwdErr.textContent = '验证中…';
    fetch('/api/remote_auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: v })
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.body && res.body.ok && res.body.token) {
        // 令牌存入 Cookie（不再写进 URL，避免地址栏明文 + 浏览器历史泄露）
        document.cookie = 'rc_token=' + encodeURIComponent(res.body.token)
          + '; path=/; max-age=' + (12 * 3600) + '; samesite=lax';
        window.location.replace('/remote_app');
      } else {
        pwdBtn.disabled = false;
        pwdErr.textContent = (res.body && res.body.error) ? res.body.error : '验证失败';
        pwdInput.select();
      }
    }).catch(function () {
      pwdBtn.disabled = false;
      pwdErr.textContent = '网络错误，请重试';
    });
  }

  pwdBtn.addEventListener('click', submit);
  pwdInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
